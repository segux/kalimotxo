name: Build Wine (CrossOver sources)

# Builds the "Battle.net ready" Wine from CodeWeavers' CrossOver LGPL sources
# and publishes it as a release asset that Kalimotxo downloads, so users do not
# depend on a third-party prebuilt. The release contains free software only:
# no Apple GPTK / D3DMetal (Kalimotxo fetches that separately when a DX12 game
# needs it). The Battle.net client and D2R run on this Wine + DXMT + MoltenVK.
#
# Recipe adapted from mikaelhug/Silo (LGPL-2.1), .github/workflows/build-wine.yml.
# See docs/wine-build.md.

on:
  # Pushing a `ci/wine-*` branch builds the default version without publishing,
  # to iterate on the recipe before it lands on main.
  push:
    branches: ['ci/wine-*']
    paths: ['.github/workflows/build-wine.yml', 'scripts/wine/**']
  workflow_dispatch:
    inputs:
      crossover_version:
        description: CrossOver source version (media.codeweavers.com/pub/crossover/source/)
        required: true
        default: 26.1.0
      publish:
        description: Publish a GitHub release (otherwise only a workflow artifact)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-wine-${{ inputs.crossover_version || '26.1.0' }}
  cancel-in-progress: false

jobs:
  build:
    # Apple Silicon runner; Wine is built for x86_64 and runs under Rosetta.
    runs-on: macos-15
    timeout-minutes: 240
    env:
      X86: arch -x86_64
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
      CX_VERSION: ${{ inputs.crossover_version || '26.1.0' }}
      LLVM_MINGW_VERSION: '20260922'
      DEPS: ${{ github.workspace }}/deps
      TAG: wine-cx-${{ inputs.crossover_version || '26.1.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      # Homebrew no longer installs on x86_64 macOS, so only build tools come
      # from the runner's native Homebrew; the x86_64 libraries Wine links are
      # built from source by scripts/wine/build-deps.sh (cached).
      - name: Install build tools
        run: |
          set -euo pipefail
          brew install bison pkgconf ccache cmake
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-macos-universal.tar.xz" -o llvm-mingw.tar.xz
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Restore x86_64 dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: wine-deps-${{ hashFiles('scripts/wine/build-deps.sh') }}

      - name: Build x86_64 dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: scripts/wine/build-deps.sh "$DEPS"

      - name: Fetch CrossOver sources
        run: |
          set -euo pipefail
          URL="https://media.codeweavers.com/pub/crossover/source/crossover-sources-${CX_VERSION}.tar.gz"
          curl -fL -A "Mozilla/5.0" "$URL" -o crossover-sources.tar.gz
          shasum -a 256 crossover-sources.tar.gz | tee crossover-sources.sha256
          mkdir -p src && tar -xzf crossover-sources.tar.gz -C src
          WINE_SRC=$(find src -maxdepth 3 -type d -name wine | head -1)
          test -f "$WINE_SRC/configure"
          echo "WINE_SRC=$GITHUB_WORKSPACE/$WINE_SRC" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-wine-${{ inputs.crossover_version || '26.1.0' }}-${{ github.run_id }}
          restore-keys: |
            ccache-wine-${{ inputs.crossover_version || '26.1.0' }}-
            ccache-wine-

      - name: Configure and build Wine (WoW64, x86_64)
        run: |
          set -euo pipefail
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export PATH="$(brew --prefix ccache)/libexec:$PATH"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export CPPFLAGS="-I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"
          # Absolute Xcode clang: llvm-mingw's own clang (on PATH) has no macOS SDK.
          export CC="$(xcrun -f clang) -arch x86_64" CXX="$(xcrun -f clang++) -arch x86_64"
          bison --version | head -1
          x86_64-w64-mingw32-clang --version | head -1
          mkdir -p build wine-install
          cd build
          # -fvisibility=default keeps winemac.drv's Metal helpers visible to
          # D3DMetal/DXMT (layered windows present black otherwise).
          $X86 env CFLAGS="-O2 -fvisibility=default" CROSSCFLAGS="-O2 -fvisibility=default" \
            "$WINE_SRC/configure" \
              --prefix="$GITHUB_WORKSPACE/wine-install" \
              --enable-archs=i386,x86_64 \
              --disable-tests \
              --without-x \
              --without-gstreamer \
              --with-freetype --with-gnutls --with-sdl --with-vulkan
          grep -E "SONAME_LIB(GNUTLS|FREETYPE|SDL2|MOLTENVK)" include/config.h
          $X86 make -j"$(sysctl -n hw.ncpu)"
          $X86 make install
          test -x "$GITHUB_WORKSPACE/wine-install/bin/wine"
          test -x "$GITHUB_WORKSPACE/wine-install/bin/wineserver"

      - name: Bundle runtime dylibs
        run: |
          set -euo pipefail
          python3 scripts/wine/bundle-dylibs.py wine-install "$DEPS" \
            "$DEPS/lib/libgnutls.30.dylib" \
            "$DEPS/lib/libfreetype.6.dylib" \
            "$DEPS/lib/libSDL2-2.0.0.dylib" \
            "$DEPS/lib/libMoltenVK.dylib"

      - name: Smoke test
        run: |
          set -euo pipefail
          export DYLD_FALLBACK_LIBRARY_PATH="$GITHUB_WORKSPACE/wine-install/lib/external"
          $X86 wine-install/bin/wine --version
          export WINEPREFIX="$RUNNER_TEMP/prefix" WINEDEBUG=-all WINEDLLOVERRIDES="mscoree,mshtml="
          $X86 wine-install/bin/wine wineboot --init
          $X86 wine-install/bin/wineserver -w
          $X86 wine-install/bin/wine cmd /c ver

      - name: Package
        run: |
          set -euo pipefail
          # LGPL: ship the licence and point to the exact corresponding source.
          cp "$WINE_SRC/COPYING.LIB" "$WINE_SRC/LICENSE" wine-install/ 2>/dev/null || cp "$WINE_SRC/COPYING.LIB" wine-install/
          cat > wine-install/SOURCE.md <<EOF
          # Kalimotxo Wine ${CX_VERSION}

          Built from CodeWeavers' CrossOver ${CX_VERSION} LGPL sources, unmodified:
          https://media.codeweavers.com/pub/crossover/source/crossover-sources-${CX_VERSION}.tar.gz
          (sha256 $(cut -d' ' -f1 crossover-sources.sha256))

          Build recipe: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/.github/workflows/build-wine.yml
          Bundled x86_64 libraries (lib/external): gnutls, nettle, gmp, freetype and SDL2 built
          from their upstream sources by scripts/wine/build-deps.sh, and the official MoltenVK
          release binary. Each keeps its own licence.
          EOF
          mv wine-install "$TAG"
          tar -cJf "$TAG.tar.xz" "$TAG"
          shasum -a 512 "$TAG.tar.xz" > "$TAG.tar.xz.sha512sum"
          ls -la "$TAG".tar.xz*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: |
            ${{ env.TAG }}.tar.xz
            ${{ env.TAG }}.tar.xz.sha512sum
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$TAG.tar.xz" "$TAG.tar.xz.sha512sum" \
            --title "Wine CrossOver ${CX_VERSION}" \
            --notes "Wine built from CodeWeavers' CrossOver ${CX_VERSION} LGPL sources for Kalimotxo (x86_64, runs under Rosetta). Free software only — see SOURCE.md inside the archive." \
            --latest=false
