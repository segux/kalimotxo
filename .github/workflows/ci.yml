name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run codecheck

      - name: Test
        run: pnpm run test

  build:
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (electron-vite)
        run: pnpm run build

      - name: Package (electron-builder, unsigned)
        # predist:mac generates build/icon.icns and build/dmg-background.png;
        # build/ is gitignored, so they must be created before packaging.
        run: |
          pnpm run predist:mac
          pnpm exec electron-builder --mac --publish=never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Kalimotxo-${{ github.sha }}-arm64-dmg
          path: dist/mac/*.dmg
          if-no-files-found: error
          retention-days: 30
